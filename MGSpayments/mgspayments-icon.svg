<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
<rect width="512" height="512" fill="white"/>
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0%" stop-color="#0f2060"/>
    <stop offset="100%" stop-color="#1a3a8a"/>
  </linearGradient>
  <linearGradient id="wave" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0%" stop-color="#3b82f6"/>
    <stop offset="100%" stop-color="#f59e0b"/>
  </linearGradient>
  <linearGradient id="arrow" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0%" stop-color="#f59e0b"/>
    <stop offset="100%" stop-color="#f97316"/>
  </linearGradient>
</defs>

<!-- TŁO -->
<rect width="512" height="512" rx="80" fill="url(#bg)"/>

<!-- FAŁDA CYFROWA -->
<path d="M60 320 Q130 220 256 270 Q380 320 452 180" fill="none" stroke="url(#wave)" stroke-width="18" stroke-linecap="round"/>
<path d="M60 360 Q130 260 256 310 Q380 360 452 220" fill="none" stroke="url(#wave)" stroke-width="10" stroke-linecap="round" opacity="0.4"/>

<!-- LITERA M -->
<text x="80" y="310" font-family="Inter,Arial,sans-serif" font-size="220" font-weight="900" fill="white" opacity="0.95">M</text>

<!-- KÓŁKO ZE STRZAŁKĄ -->
<circle cx="400" cy="130" r="72" fill="url(#arrow)"/>
<path d="M372 130 L428 130" fill="none" stroke="white" stroke-width="10" stroke-linecap="round"/>
<path d="M408 108 L430 130 L408 152" fill="none" stroke="white" stroke-width="10" stroke-linecap="round" stroke-linejoin="round"/>

<!-- TEKST MGS -->
<text x="256" y="420" font-family="Inter,Arial,sans-serif" font-size="58" font-weight="900" fill="white" text-anchor="middle" letter-spacing="-1">MGS</text>
<text x="256" y="470" font-family="Inter,Arial,sans-serif" font-size="34" font-weight="400" fill="#93c5fd" text-anchor="middle" letter-spacing="8">PAYMENTS</text>
</svg>
